# データ収集バッチの並列度・リトライ・サーキットブレーカー設定
# (要件定義書 8.1・8.3・14.9・18.1・18.4・18.7)

# 並列ワーカー数(8.1・14.9:速度よりYahoo側のブロック回避=完走率を優先)
# 実データ検証(2026-08-23):並列8・ジッタ0.5〜2.0秒の設定で800銘柄の収集を
# 試みたところ、約5分・478銘柄処理時点でtransient_failureが急増し
# (144/478=30.1%)サーキットブレーカーが作動した(19章)。Yahoo側のレート制限が
# 実際にこの負荷水準で発動することを確認したため、並列度を下げジッタを広げた。
# (24.7:旧min_workersは実装のどこからも参照されない死んだ設定値だったため撤去。
# 常にmax_workers固定で動作する)
#
# S-8是正(2026-09-04、docs/daily_pipeline_throughput_plan_2026-09-04.md):
# 上の8月23日の事故と矛盾するように見えるが、事故当時は**リミッターが実HTTP
# レートを制限していなかった**——`_throttle()`は`fetch_raw_financials`等の
# 呼び出し単位でしかacquireせず、1呼び出しが最大6本のHTTPを出すため、
# ワーカー数がそのまま実HTTPレートに掛かっていた。並列8はYahooを本当に
# 洪水攻撃していた。S-1(2026-09-04)でリミッターを実HTTPリクエスト境界
# (`YfData._make_request`)へ移した後は、ワーカー数を上げても実HTTPレートは
# `yfinance_requests_per_second`(6.0)を超えられない——ワーカー数が埋めるのは
# 「天井の下で空いている時間」だけである。
#
# 実測(2026-09-04、5,799銘柄、並列5):collection は 0.945銘柄/秒
# (=2.83 req/秒、天井6.0の47%)しか出ていなかった。ボトルネックはレートでは
# なく、`run_parallel`が銘柄ごとに挟む1〜3秒(平均2.0秒)のジッタで、
# ワーカー1本あたりの占有時間が5.29秒/銘柄になっていたこと(consensus は
# ジッタが無いため同じ天井の96%まで使えている)。天井を使い切る2.0銘柄/秒に
# 必要なワーカー数は 2.0 × 5.29 ≈ 10.6 → 10 に引き上げる。
#
# 結果として生じる実効レート(見込み約5.67 req/秒、天井の94%)は、
# 2026-09-03以前に**数週間、日次で持続していた**6.34 req/秒(失敗率0.5%)
# より低い。つまり未知の負荷水準に踏み込むわけではない。
#
# `max_workers`は`collect_consensus`(S-4)とも共有される設定値だが、
# consensusは既に実効5.76 req/秒(天井の96%)まで使い切っており、ここに
# ワーカーを足しても余地が無い。したがってこの引き上げの効果はcollection
# にのみ生じ、consensusの所要時間は変わらない見込み。
max_workers: 10

# リクエスト間のジッタ(秒)。固定間隔だと逆にパターン検知されやすいため範囲を持たせる
request_jitter_min_seconds: 1.0
request_jitter_max_seconds: 3.0

# 2026-08-30:Yahooへの秒あたり上限(全ワーカー合計)。ジッタは「送信間隔を
# 揺らす」ためのもので上限にはならない——Yahooが速く返すほど実効レートが
# 上がってしまうため、天井をここで別に決める。
#
# 2026-09-04是正(S-1、docs/daily_pipeline_throughput_plan_2026-09-04.md):
# 上の2.0は実効レートを表していなかった。旧`_throttle()`は`fetch_raw_financials`
# 等の**呼び出し単位**でしかacquireしておらず、1回の呼び出しが出す実HTTPは
# 最大6本(quoteSummary×1 + fundamentals-timeseries×5)。実測(2026-09-02、
# `YfData._make_request`を計数)では実効HTTPレートが**6.34 req/秒**——
# 名目上限の3.2倍で既に走っていた。リミッターを実HTTPリクエスト単位に
# 是正した(`yfinance_client._install_http_throttle`)うえで、その実測値を
# わずかに下回る6.0に設定し直す。これによりピークレートは今より下がる
# (6.34→6.0)一方、以降の並列化(consensus・週次財務諸表の格下げ等)が
# 「上限を超えない」ことが構造的に保証される。
yfinance_requests_per_second: 6.0

# S-7(2026-09-04、docs/daily_pipeline_throughput_plan_2026-09-04.md):
# `event_calendar`の決算日を過ぎたティッカーは週次を待たず財務諸表を
# 再取得する。この猶予日数(決算日+何日後まで再取得を試みるか)。
# 3日程度あればyfinance側の反映ラグ(通常1〜2日)を吸収できる。
statement_refresh_grace_days: 3

# 発行済株式数は毎取引日変わる値ではない。直近観測値をPITメタデータ付きで
# 持ち越し、週次または決算・希薄化関連SEC提出・株式分割時に再取得する。
shares_refresh_interval_days: 7

# 市場系工程を実行済みとみなす最低価格カバレッジ。1銘柄だけ未来日付を持つ
# ケースで全体を誤ってskipしないため、active universeの90%以上を要求する。
market_session_min_coverage: 0.90

retry:
  # TransientFailureのみ対象。PermanentFailure/ParseFailureはリトライしない(18.1)
  max_attempts: 3
  backoff_base_seconds: 2.0
  backoff_max_seconds: 30.0

circuit_breaker:
  # この件数を処理するまでは失敗率で判定しない(統計的なノイズを避ける)
  min_sample_size: 50
  # 18.7:警告30%超で運用アラート相当。バッチ自体もこの閾値で自己中断する
  failure_rate_threshold: 0.30

quarantine:
  # 同一銘柄が連続でこの回数失敗したら隔離リストへ(18.1)
  consecutive_failure_threshold: 5
  # 隔離後の再挑戦間隔(日次ではなく週次に格下げ)
  retry_interval_days: 7

# 30.3:SEC EDGAR。`user_agent` は .env の EDGAR_USER_AGENT から読む
# (連絡先メールアドレスを含むためgit管理下に置かない)。
edgar:
  enabled: true
  # 2026-08-30:8.0 から下げた。SECの公表上限は約10 req/s だが、これは
  # **IP単位**の制限であり、このプロセスだけが送信元とは限らない
  # (ブラウザ・同時に走る別のバッチやテストスイートも同じIPから出ていく)。
  # 上限の8割を1プロセスで使い切る設定には余裕が無く、実際に制限に触れた。
  # 個人利用のバッチで数分の差は問題にならないので、半分にして余裕を取る。
  requests_per_second: 5.0
  # S-5(2026-09-04、docs/daily_pipeline_throughput_plan_2026-09-04.md):
  # litigation/filing_sections/dilution/customer_concentrationの銘柄ループを
  # 並列化する際のワーカー数。実測(litigation):299銘柄で実質0.26 req/秒
  # ——設定上限5.0の5%しか使えていなかった。原因はレート制限ではなく
  # **完全な逐次ループだったこと**。上限は`requests_per_second`側で効くので、
  # ここを大きくしても実効レートは上がらない(1リクエストの往復時間が
  # リミッターの間隔より長いぶんの「遊び」を埋めるだけ)。
  max_workers: 10
  # EDGAR全文検索はCIKをこの件数ずつまとめ、銘柄ごとの同一検索を避ける。
  litigation_cik_batch_size: 50
  # 増分検索は境界訂正・遅延indexを拾うため直近成功日から重複して検索する。
  litigation_overlap_days: 2
  timeout_seconds: 30.0
  # 本文取得(going concern等の検出)を行うか。1銘柄あたり数MBの転送になるため、
  # 追跡対象銘柄(30.3.4)に限って実行する。
  document_fetch_enabled: true
  # 日次で提出一覧を取りに行く銘柄数の上限。ユニバース全体(数千件)を毎日
  # 舐めるのはSECにもこちらにも過大なので、追跡対象だけに絞る。
  max_tracked_tickers: 300
  # 429/503(Retry-After指定なし)・403(遮断)を受けたときに、SEC向け
  # リクエスト全体を止める秒数。残りの銘柄が遮断中のSECを叩き続けて
  # 遮断が長引くのを防ぐ。
  throttle_cooldown_seconds: 60.0
  retry:
    max_attempts: 3
    backoff_base_seconds: 1.0
    backoff_max_seconds: 30.0

# 30.8:FRED(マクロ系列)。`api_key` は .env の FRED_API_KEY から読む。
# キー未設定ならフェーズ7全体を無効として扱う(APIは200 + 未設定状態を返す)。
fred:
  enabled: true
  series_ids:
    - DGS10          # 米10年債利回り
    - DFII10         # 米10年実質金利
    - BAMLH0A0HYM2   # ハイイールドOAS
    - DEXJPUS        # USD/JPY（JPYシナリオ・マクロ感応度）

macro_exposure:
  frequency: weekly
  minimum_weeks: 52
  recommended_weeks: 104
  transforms:
    DGS10: difference
    DFII10: difference
    BAMLH0A0HYM2: difference
    DEXJPUS: return

# K-9:Claude API(定性分析)。`api_key` は .env の ANTHROPIC_API_KEY から読む。
# キー未設定ならLLM機能全体を無効として扱う(FREDと同じ方針)。
#
# **ここで作る出力はゲートにもスコアにも入らない**(config.py の LlmConfig
# docstring 参照)。表示・ノート起草・人間の下読み専用であり、`llm_analyses`
# 表に隔離してある。
llm:
  enabled: true
  # K-9(docs/ui_llm_provider_selection_2026-08-30.md):どのAPIに投げるか。
  #   anthropic     = Claude native(既定)。要約・定性評価・レポートすべて対応。
  #   openai_compat = OpenAI互換 /v1/chat/completions。ChatGPT / NVIDIA NIM /
  #                   Ollama / vLLM / LM Studio / LiteLLM。.env の OPENAI_API_KEY と
  #                   下の base_url で接続先を決める。Batch API は無いので
  #                   score-qualitative は逐次呼び出しにフォールバックする(半額にならない)。
  provider: anthropic
  # openai_compat のエンドポイント。空/未設定なら api.openai.com。
  #   例: http://localhost:11434/v1(Ollama)、https://integrate.api.nvidia.com/v1(NIM)
  base_url: null
  # openai_compat で effort を reasoning_effort として送るか。既定は送らない
  # ——互換サーバの多くは未知パラメータを 400 で弾くため。推論モデルのときだけ true。
  send_effort: false
  model: claude-opus-5
  effort: high          # low | medium | high | xhigh | max
  max_output_tokens: 8000
  # 1回の呼び出しに入れる本文の上限(文字数)。超過は切り詰めではなく失敗にする。
  max_input_chars: 120000
  # 1回の実行で扱う銘柄数の上限。**課金**が効く上限なので意図的に小さい。
  max_tickers_per_run: 25
  batch_poll_interval_seconds: 30.0
  batch_timeout_seconds: 86400.0
