# ユニバース定義(要件定義書 4章・13.2・15.2・15.6)
# 初期リリースは米国株のみ(13.2:日本の小型グロース株はyfinanceのカバレッジが
# 実質0〜3四半期分しかなく、フェーズ1では検証不能なため)。
#
# 2026-08-23、NASDAQ/NYSE候補5,312銘柄からの無作為抽出370銘柄(実データ)で
# 各閾値の妥当性を検証済み。検証方法・根拠は docs/10bagger_app_requirements.md
# 19章を参照。母集団のうちFinancial Servicesが27%(100/370)を占めるなど、
# セクター除外の実効性がここで初めて定量的に裏付けられた。

market: US

# --- 規模の上限(29章:目標倍率に追随させる) --------------------------------
#
# **上限は目標(何年で何倍)の関数である。** 15.6が規模の上限を置いた根拠は
# 「大きすぎる企業は算数上10倍になれない」であり、これは**10倍という目標に
# 依存した理屈**だった。27.24で目標を自由に切り替えられるようにしたのに上限を
# 定数のまま据え置いていたため、「3年で3倍」を選んでも母集団は10バガー用の
# ままという不整合が残っていた(29.1)。
#
# 実効上限 = exit_*_ceiling_usd ÷ 目標倍率(materialize 範囲で頭打ち)。
#   7年で10倍(既定) → 3.5B / 3B  ← 29章以前の固定値と完全に一致する
#   5年で5倍         → 7.0B / 6B
#   3年で3倍         → 11.7B / 10B
#
# ---- 出口(目標達成時点)の規模の上限 ----
# 「7年後に$35Bを超える会社にはならないだろう」という、19章の$3.5Bに暗黙裡に
# 入っていた前提を明示したもの(3.5B × 10倍 = 35B)。この定義により、既定の
# 目標では従来と1ドルも変わらない上限が再現される=既存の較正を壊さない。
#
# ホライズンには依存させていない。「10年なら市場全体も成長するぶん出口は
# 大きくてよい」という理屈は成り立つが(名目GDP成長率3%で7年→10年なら+9%)、
# 効果が小さいわりに自由なパラメータが1つ増えるため採らない。
exit_market_cap_ceiling_usd: 35_000_000_000
exit_revenue_ceiling_usd: 30_000_000_000

# ---- materialize する母集団(最も緩い目標) ----
# バッチ(apply-gates → run-scoring)が実際にスコアを計算する範囲を、ドル建てでは
# なく**目標倍率で**指定する。スコアは日次で1組しか作れないので母集団は最も緩い
# 目標に合わせて広く取り、目標ごとの絞り込みはAPI側で行う。
#   3.0倍 → 時価総額 35B/3 = 11.7B、TTM売上高 30B/3 = 10B
# UIのプリセットで最も緩い「3年で3倍」をちょうど覆う値。これより緩い目標
# (APIは1.5倍まで受け付ける)を指定した場合、上限はここで頭打ちになり、
# レスポンスの `universe_ceiling_capped` が真になる(UIが明示する)。
#
# **実測(2026-08-27、擬似バックテスト・目標3年で3倍・保有1年・評価日9点)**:
# 上限だけを変えて同じモデルを回した結果。
#   上限        観測数   単調性   リフト(最悪日)  順位IC   上位デシル破綻率
#   3.5B(現行) 2,947   +0.794   1.38 (0.86)     +0.146   11.7% vs 10.8%
#   12B(採用)  5,116   +0.879   1.55 (1.37)     +0.140    9.5% vs  8.1%
#   24B         5,976   +0.952   1.64 (1.37)     +0.131    9.3% vs  7.4%
# (採用値は 35B/3.0 = 11.7B。実験は切りのよい 12B で回しており、この0.3Bの差で
#  入れ替わるのは数銘柄なのでKPIの読みは変わらない)
#
# 読み方に注意:リフトの改善の大半は**分母(ユニバースのオンペース率)が
# 22.8%→20.3%へ下がったこと**による。上位デシルの的中率そのものは3案とも
# ほぼ30%で動かない。意味があるのは次の2点。
#   ① 最悪評価日のリフトが 0.86 → 1.37(1を割る=その日は上位デシルが
#      ユニバースに負けた、という既知の弱点が解消する)
#   ② **新しく入る帯がランキングを占拠しない**。$3.5B以上はユニバースの
#      37.7%を占めるのに上位デシルでは31.1%にとどまる。規模中立なモデル
#      (size_prior.exponent = 0.0)が大型株で暴走するという事前の懸念は、
#      条件付きの実測では再現しなかった。
#
# 24Bを採らない理由:単調性とリフトはさらに良く見えるが、それは①と同じく
# 分母の希薄化が効いている一方、**順位ICは3案の中で最も低い**(+0.131)。
# κ・σ・生存ハザードはいずれも$3.5B以下の母集団で測った値であり、外挿を
# 7倍まで広げる根拠としてはこのKPI差は弱い。3.3倍(11.7B)に留める。
min_supported_target_moic: 3.0

# TTM売上高の上限(exit_revenue_ceiling_usd)を時価総額と**AND条件**で併用する
# 理由(15.6):どちらか一方だけでは「時価総額は低いが売上は巨大な低採算企業」を
# 取りこぼす。実データ検証:時価総額$3.5B未満の銘柄のうち28.2%が$3Bの売上高上限を
# 超過しており(19章)、時価総額ゲート単独では捕捉できない低採算・資産集約型企業が
# 現実に一定数存在することを確認した(15.6の理論的懸念が実データで裏付けられた)。
# 売上高の上限も目標倍率で割るのは、MOICが概ね売上倍率で決まるため——10倍を
# 狙うなら売上も概ね10倍になる必要がある、という同じ理屈による。

# 株価下限(15.2:ペニー株・上場廃止基準回避)。NYSE/NASDAQの継続上場基準
# (最低気配値$1)そのものに根拠があるため、実データの分布(6.8%が該当)に
# 関わらずこの水準を維持する(19章)。
min_price_usd: 1.0

# 日次売買代金(中央値)下限(15.2:実際に売買可能な流動性の担保)
# ⚠ 暫定値:実データ検証は収集当日(2026-08-21営業日)の単日出来高×終値のみに
# 基づく代理指標であり、30.5%が該当という結果は単日のノイズを含み得る(19章)。
# 本来の設計どおり20〜60営業日の中央値が算出できるようになった時点
# (price_snapshotsの蓄積後)で必ず再calibrationすること。
min_daily_dollar_volume_usd: 1_000_000

# 上場後の最低経過四半期数(4章)
min_listed_quarters: 4

# 除外セクター(2.1:指標の非対称性を避けるため金融セクターを除外。
# ETF/REIT/ADRは静的シンボルリストの時点で除外— universe_source.py 参照)
# v1.3修正:実データ検証で "Real Estate" セクター(主にREIT)が現行の
# excluded_sectorsをすり抜けていることが判明(4章はREIT除外を明記しているが、
# セクター名ベースの除外リストへの反映が漏れていた)。ABR/AAT/GNL等、
# 時価総額$3.5B未満のREITが実際に候補プールに残っていたため追加(19章)。
excluded_sectors:
  - "Financial Services"
  - "Financial"
  - "Real Estate"
