# 取引コスト・約定モデル(docs/defect_and_edge_audit_2026-08-28.md D-5 / I-7)
#
# スプレッドは既存OHLCVから Corwin–Schultz で推定するため設定不要。ここに置くのは
# 平方根則マーケットインパクトの係数と、口座固有の手数料・下限スプレッドだけ。
#
#   impact = k * sqrt(position_usd / ADV_usd)   （片道の相対コスト）
#
# k はマイクロキャップの実測レンジ(0.1〜0.3)の下寄り。ADV の10%を建てると
# k=0.1 で片道 約316bps。ここは「無いよりまし」の水準で、D-5 の受け入れ基準
# (コスト前後差が超過CAGRの半分を超えるかどうかの判断材料)を出すのが目的。
impact_coefficient: 0.10

# 往復の定額手数料相当(bps)。個人口座で無料なら 0。
commission_bps: 0.0

# 片道の下限半スプレッド(bps)。Corwin–Schultz が 0 近傍へ潰れる薄商い日でも、
# マイクロキャップで実質0コストはありえないための床。
min_half_spread_bps: 15.0
