# Model v5 remains an independent shadow challenger. Phase 2 expands the v4
# structural seed into an explicit scenario mixture. No Live Intelligence
# feature changes a state until its later implementation phase is accepted.
enabled: true
mode: shadow
model_version: v5
implementation_version: v5.phase6
target_horizon_years: 7
target_moic: 10.0

reliability:
  ready_input_confidence: 0.50
  unavailable_input_confidence: 0.00
  # WP-D (docs/racr_wp_d_reliability_layer_2026-09-04.md): real per-ticker
  # confidence range. ready_input_confidence above is now only the fallback
  # used when no per-ticker evidence can be measured at all.
  min_base_confidence: 0.10
  max_base_confidence: 0.90
  statement_freshness_half_life_days: 270.0
  target_annual_periods: 4.0
  target_price_history_rows: 756.0

# WP-F1 (docs/racr_wp_f1_path_risk_2026-09-04.md): block-bootstrap
# historical-simulation tuning for scoring/v5/path_risk.py. Governs the
# simulation only -- not a return/volatility parameter, and never read from
# the V4 seed.
path_risk:
  simulations: 300
  block_weeks: 4

uncertainty:
  confidence_sigma_multiplier: 0.50
  left_tail_multiplier: 1.25
  scenario_log_shift_sigma: 0.50

growth:
  consensus_revision_weight: 0.35
  operating_kpi_weight: 0.20
  guidance_weight: 0.35
  max_initial_growth_adjustment: 0.08
  min_initial_growth_rate: -0.50
  max_initial_growth_rate: 0.75
  min_kpi_comparison_days: 60
  max_kpi_comparison_days: 450
  tam_min_headroom_ratio: 1.01
  ablation_enabled: true

quality:
  nopat_tax_rate: 0.21
  min_annual_periods: 2
  max_measurement_years: 6.0
  min_measurement_days: 300
  incremental_roic_hurdle_rate: 0.10
  incremental_roic_weight: 0.15
  max_duration_reduction_years: 2.0
  per_share_gap_weight: 0.25
  max_mean_multiplier_reduction: 0.30
  cash_conversion_ni_floor_ratio: 0.01
  cash_conversion_ratio_winsor_abs: 5.0
  accounting_sigma_max_multiplier: 1.5
  accounting_left_tail_extra_max: 0.35
  reconciliation_confidence_penalty: 0.10
  ablation_enabled: true

capital:
  debt_maturity_weight: 0.25
  debt_maturity_min_survival_multiplier: 0.85
  liquidity_runway_floor_months: 12.0
  liquidity_weight: 0.25
  liquidity_min_survival_multiplier: 0.85
  capital_allocation_lookback_days: 365
  capital_allocation_weight: 0.20
  capital_allocation_min_survival_multiplier: 0.90
  future_dilution_atm_shelf_component_cap: 0.50
  future_dilution_options_component_cap: 0.50
  future_dilution_variable_conversion_bump: 0.05
  future_dilution_weight: 0.15
  future_dilution_max_reduction: 0.15
  max_combined_dilution_reduction: 0.35
  ablation_enabled: true

tail:
  customer_concentration_weight: 0.20
  customer_concentration_left_tail_max: 0.20
  litigation_lookback_days: 365
  litigation_severity_count_cap: 3
  litigation_weight: 0.15
  litigation_left_tail_max: 0.15
  macro_regime_weight: 0.10
  macro_regime_left_tail_max: 0.10
  max_combined_left_tail_extra: 0.35
  ablation_enabled: true

scenario_weights:
  downside: 0.20
  base: 0.60
  upside: 0.20

# Later phases may enable these only after their state mapping, PIT contract,
# missingness policy, and ablation tests exist.
feature_flags:
  tam_headroom: true
  operating_kpi_nowcast: true
  consensus_revision: true
  guidance: true
  incremental_roic: true
  accounting_quality: true
  per_share_economics: true
  cash_conversion: true
  reconciliation_confidence: true
  capital_allocation: true
  debt_maturity: true
  liquidity: true
  # future_dilution_capacity (2026-09-03, Phase 6): principle 3 in
  # collect_dilution.py is now scoped to v4's evaluate_gates/scoring/ only
  # (user decision, Issue #3 section 12); v5 reads dilution_capacity with
  # an explicit anti-triple-counting budget shared with per_share_economics.
  future_dilution_capacity: true
  customer_concentration: true
  litigation: true
  macro_regime: true
  # acquisition_competing_risk stays disabled: 94/94 delisting_events rows
  # are event_type=unknown, below any defensible classification-coverage
  # threshold, and Issue #3 section 13 prohibits treating unknown as
  # acquisition=0. Not implemented in code at all, not just gated off.
  acquisition_competing_risk: false
