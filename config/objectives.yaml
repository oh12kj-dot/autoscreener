# Distribution-only objectives are enabled in Phase 2. Objectives that require
# quality states or execution inputs stay disabled until those phases exist.
default_objective: ten_bagger
objectives:
  ten_bagger:
    description: Probability of reaching the configured target MOIC.
    # Phase 10 (docs/model_v5_phase10_*.md): discounts P(target) for the
    # part of that probability mechanically attributable to a
    # reliability/quality-driven widening of the distribution (see
    # ObjectiveDefinition in config.py for the full rationale). Values
    # tuned empirically against the real 2026-09-02 universe -- see the
    # Phase 10 evidence doc for the measured before/after correlation.
    reliability_sigma_lambda: 20.0
    reliability_left_tail_lambda: 20.0
  expected_return:
    enabled: true
    description: Expected compound annual return.
  risk_adjusted:
    enabled: true
    deprecated: true
    description: >-
      Deprecated (docs/racr_wp_b_output_contract_2026-09-04.md; audit
      autoscreener_racr_integrated_redesign_audit_2026-09-04.md §4.3):
      superseded by risk_adjusted_compounding, which multiplies by loss
      probability instead of only loss depth. Kept enabled and computed
      for champion/challenger comparison against historical runs -- do not
      remove.
    downside_lambda: 0.50
  # WP-B (docs/racr_wp_b_output_contract_2026-09-04.md; audit
  # autoscreener_racr_integrated_redesign_audit_2026-09-04.md §5.2): the new
  # risk-aware objective, added as a *shadow* alongside (not replacing)
  # `ten_bagger` -- `default_objective` above stays `ten_bagger` until a
  # separately-gated promotion decision (plan WP-H) reviews live RACR vs.
  # ten_bagger/expected_return ranking behavior. Lambda values are fixed
  # investment-policy priors (audit §5.2 table), not backtest-fitted
  # parameters -- see `ObjectiveDefinition` in config.py for why, and for
  # why drawdown_lambda/permanent_loss_lambda currently multiply an
  # explicit 0 (their statistics are `unavailable`, not computed as zero
  # risk).
  # WP-B2 (docs/racr_wp_b2_risk_terms_2026-09-04.md): the first real shadow
  # run showed Spearman(RACR, ce_cagr) == 1.0000000000 for 1,155/1,155
  # tickers (docs/racr_shadow_run_diagnostic_2026-09-04.md) -- the tail term
  # measured at the fixed 10% quantile always landed inside the failure
  # atom (every ticker's failure mass exceeded 10%) and collapsed to one
  # identical constant. `tail_lambda` now multiplies a tail measure taken
  # *conditional on survival* (the failure atom excluded, not floored), and
  # `failure_lambda` prices failure frequency as its own separate term --
  # see `ObjectiveDefinition.failure_lambda` in config.py for why this is
  # not the same field as `permanent_loss_lambda`.
  risk_adjusted_compounding:
    enabled: true
    description: >-
      Certainty-equivalent CAGR less tail-loss (conditional on survival),
      failure-frequency, drawdown, permanent-loss, and model-uncertainty
      penalties (shadow; default_objective stays ten_bagger until
      promotion). Drawdown and permanent-loss terms are currently omitted
      (unavailable) -- see explanation.omitted_terms on every scored
      ticker. Contract version v5.racr2: RACR values are not comparable
      across contract versions (see docs/racr_wp_b2_risk_terms_2026-09-04.md).
    tail_lambda: 0.35
    failure_lambda: 0.20
    drawdown_lambda: 0.10
    permanent_loss_lambda: 0.20
    uncertainty_lambda: 0.50
  quality_compounder:
    enabled: false
    description: Distribution-led long-duration per-share compounding objective.
  asymmetric:
    enabled: true
    description: Right-tail probability relative to left-tail severity.
    right_tail_moic: 5.0
  capital_preservation:
    enabled: true
    description: Survival and low expected shortfall objective.
  execution_adjusted:
    enabled: false
    description: Separate tradability and execution-cost adjustment.
