# 実現時価総額倍率(implied MOIC)モデル v4 の設定(要件定義書 27章・28章)
#
# v2(8サブスコアのパーセンタイル加重幾何平均)は27.1で廃止した。その構造が
# 「弱点のない銘柄」を選び、10バガー探索の目的関数として符号が逆向きである
# ことが実データで確定したため(スコアと売上成長率の相関 −0.068、
# スコアと ln(時価総額) の相関 +0.227)。
#
# v3 → v4 の変更(28章)。v3の擬似バックテストはリフト倍率1.21・デシル単調性
# +0.59に留まっていた。因子ごとの予測力を実測した結果、原因はモデルが持って
# いた「終端マルチプルのセクター中央値への平均回帰」項が順位を**悪化**させて
# いたことにあった(順位IC −0.023、t=−3.1)。v4はこれを撤廃し、成長フェード
# 整合のマルチプル圧縮・価格ナウキャスト・σの縮小推定を入れている。
#
# **パラメータの性質を3つに区別すること。**
#   (a) 断面から測った構造パラメータ  … multiple.growth_elasticity
#   (b) 公表された基準率からの事前値  … survival.*, uncertainty.*_sigma
#   (c) 擬似バックテストで選んだ値    … growth.nowcast_*, uncertainty.sigma_shrinkage
# (c)は独立な観測期間が実質3つ程度しかない標本で選んでいるため、**弱くしか
# 特定されていない**。変更したら必ず `run-backtest` でKPIの変化を確認すること。

scoring_version: "v4"

# --- ホライズン(14.1:7年で10倍 = 年率38.9%) ---------------------------------
#
# **7年に実証的な根拠は無い**(27.23)。14.1の表は「定義(案)」と明記されており、
# 出典も検証もない作業上の仮定である。後付けの理屈としては:
#   5年  → 必要CAGR 58.5%(厳しすぎて候補が枯れる)
#   7年  → 必要CAGR 38.9%(現実に達成例のある水準)
#   10年 → 必要CAGR 25.9%(年次決算が最大5期しか取れないため外挿に無理がある)
# つまり「到達可能性」と「予測可能性」の折衷点。
#
# **実測(2026-08-25):5〜10年の範囲では順位はほとんど変わらない。**
#   5年 : 7年との順位相関 +0.979、上位50の一致 44/50
#   10年: 7年との順位相関 +0.971、上位50の一致 43/50
#   15年: 7年との順位相関 +0.848、上位50の一致 31/50  ← 極端な設定は避けること
# 一方で確率の**絶対水準**は大きく動く(中央値が5年0.037% → 10年0.125%)。
horizon_years: 7
target_moic: 10.0

# --- 成長の減衰(27.2)と価格ナウキャスト(28.3) -------------------------------
growth:
  # 減衰後に収束する終端成長率(名目GDP相当)
  terminal_rate: 0.03
  # 毎年 (g_t - terminal) がこの比率で縮む。0.75 なら7年目に初期超過分の13%が残る
  fade: 0.75
  # 初期成長率の上限・下限。7年間の外挿に耐える範囲に丸める。
  # 27.13:1.00では、買収による連結で見かけのCAGRが+214%になったIMMRが
  # 上限いっぱいの100%を得て売上9.4倍を織り込んでいた。7年間持続する成長率と
  # して現実的な上限は60%程度(それでも売上4.4倍)。
  max_initial_rate: 0.60
  min_initial_rate: -0.30
  # S-7:成長率の観測が**1つしか無い**銘柄に適用する、より保守的な上限。
  #
  # 27.13の「CAGRとYoYが食い違ったら遅いほうを信じる」という安全装置は、
  # 比較対象がある銘柄でしか働かない。上場直後などで片方しか測れない銘柄
  # (BRUN型)は、検証されないまま上限いっぱいの成長率を採用してしまう。
  #
  # **2026-08-26の欠陥修正**:この値は `config.py` の既定 1.0 のまま本ファイルに
  # 書かれておらず、`min(max_initial_rate, 1.0) = 0.60` となって**S-7は実質
  # 無効だった**(モデルのdocstringもテストも「保守的な上限を適用する」と
  # 主張していたが、実際には何もしていなかった)。合わせて、ナウキャスト補正が
  # この上限を迂回して `max_initial_rate` まで戻せていたバグも直した。
  #
  # 実測(2026-08-26、擬似バックテスト・1年ホライズン・8評価日):
  #   1.00(無効): 単調性 0.806 / リフト 1.46 / 最悪日 1.03 / 上位デシル破綻 10.5%
  #   0.45       : 単調性 0.806 / リフト 1.51 / 最悪日 1.03 / 上位デシル破綻 10.2%
  #   0.35       : 単調性 0.879 / リフト 1.51 / 最悪日 0.83 / 右裾5%の最悪日 0.82
  #   0.25       : 単調性 0.915 / リフト 1.45 / 最悪日 0.83 / 右裾5%の最悪日 0.97
  # 0.35以下は単調性と引き換えに**最悪評価日のリフトが1を割る**(28.16で解消
  # 済みだった弱点の再発)。どのKPIも悪化させない 0.45 を採る。
  max_initial_rate_single_observation: 0.45

  # 30.1:**循環と構造を区別する。**(investment_theory_review_2026-08-30.md)
  #
  # 初期成長率も終端粗利率も「直近の観測をそのまま7年へ引き伸ばす」推定量である。
  # 単調に伸びている事業では不偏に近いが、**循環している事業では観測時点が
  # 循環のどこにあるかで符号ごと変わる**。市況が上向いた直後の資源会社は
  # 「売上も粗利率も急改善している企業」に見えるが、その改善は7年続かない。
  #
  # v4 はこれを `revenue_growth_volatility` → σ の経路でしか扱っていなかった。
  # だが(a)循環は分散ではなく**点推定のバイアス**であり、(b)σ は 85% 縮小される
  # ため断面差は実質残らない(実測:raw σ の断面SD 0.182 → 縮小後 0.023)。
  # したがって σ ではなく点推定側で割り引く。
  #
  #   一致度 consistency = |Σ Δ| / Σ |Δ|  (年次系列の一方向性、0〜1)
  #   g_eff = terminal + (g0 − terminal) × (1 − damping × (1 − consistency))
  #
  # 実データ(2026-08-28、687銘柄)の売上の一致度:充足率 99.4%、
  # p10 = 0.24 / p25 = 0.55 / p50 = 0.99。セクター別中央値は Energy 0.61 に対し
  # Healthcare 1.00・Technology 0.97 と、想定どおりに分離する。
  #
  # 実測(compare-configs、1年ホライズン・9評価日、damping = 0.5):
  #   lift 1.401 → 1.371(−0.030)、単調性 0.794 → 0.818(+0.024)、
  #   rank_IC 0.099 → 0.100(+0.001)。**3項目ともCI内(INDISTINGUISHABLE)。**
  # 採用の根拠はKPIではなく「推定量のバイアスを直しているか」である(D-2 のとおり
  # 有効標本は実質3しかなく、KPIでこの規模の差を判定することはできない)。
  # 全部(1.0)ではなく半分(0.5)にしてあるのは、一致度という測り方自体が新しく、
  # 部分的な補正のほうが保守的な読みだからである。
  cyclicality_damping: 0.5

  # 28.3:**決算の陳腐化を価格で補正する。**
  # 評価時点で使える年次決算は、期末 + 開示ラグ90日を経てはじめて可視になる。
  # 最悪の場合モデルは15ヶ月前の事業実態から7年後を外挿している。その間に
  # 市場が織り込んだ情報を、成長率推定の修正として取り込む。
  #
  # 補正量 = nowcast_weight × (12ヶ月対数リターン − 断面中央値) ÷ growth_elasticity
  #
  # **これはモメンタム戦略ではない**——順位にモメンタムを足すのではなく、
  # モデルの入力である成長率を修正する。したがって粗利率・希薄化・レバレッジが
  # 悪ければ、株価が上がっていても順位は上がらない。
  #
  # 実測(28.3):この項を入れると順位IC が 1年 +0.063→+0.082、
  # 2年 +0.080→+0.103、デシル単調性が 2年 +0.47→+0.59 に改善する。
  # 27.21②が挙げていた「加速中の企業を保守側に丸めている」問題(ランキング
  # 対象の15%)への直接の対処でもある。
  #
  # weight は「株価の相対的な動きのうち、成長期待の改定に帰属させる割合」。
  # 1.0 は株価変動のすべてが成長期待の改定だと信じることになり、明らかに
  # 過大である。0.25 は控えめな事前値。
  nowcast_weight: 0.25
  # 補正の絶対上限(ポイント)。±15pt を超えて成長率推定を動かさない。
  #
  # S-8(2026-08-26、model_audit_v4_2026-08-26.md)の監査結果:実測では上位
  # 銘柄の約3割がこの上限に張り付いており(`run-backtest` の
  # `nowcast_cap_hit_rate` で監視可能にした)、決算ベースが縮小(負)なのに
  # 補正で成長側へ反転する例(ALTO・DBI・MEI等)も見つかった。**「一次情報を
  # 株価で上書きしている」という仮説自体は妥当**だが、対処として試した
  # 2案は両方とも実測でKPIを悪化させた:
  #   nowcast_cap 0.15→0.10          : 単調性 0.842→0.782、最悪日リフト 1.02→0.90
  #   反転方向にのみ狭い上限(0.03〜0.08): 単調性 0.842→0.76〜0.79、他は横ばい
  # どちらも「一次情報の上書きを防ぐ」以上に「成長株の入口を削る」副作用が
  # 勝った。**したがって値は変更せず、`nowcast_cap_hit_rate` による監視だけを
  # 追加した。** 仮説を実装で先取りせず、まずデータで検証するという本ファイル
  # 冒頭の方針どおりの結果である。
  nowcast_cap: 0.15
  # S-8: 反転方向補正専用の上限。上のとおり実測で有効性を示せなかったため、
  # nowcast_cap 以上(=事実上無効)にしてある。将来、より長い観測期間で
  # 再検証する余地は残す。
  nowcast_cap_sign_flip: 1.0

  # 28.10:**事業の質で成長の持続性を変える。**
  # v3は fade を全銘柄共通の定数にしていたが、それは「どんな企業でも超過成長は
  # 同じ速さで消える」という主張であり、成長株投資の中核にある持続性の差を
  # 最初から無いことにしている。
  #
  # 持続性の代理指標は Piotroski F-score。9項目は収益性(ROA・営業CF・その改善・
  # アクルーアルの少なさ)、レバレッジと流動性、営業効率(粗利率と資産回転率の
  # 改善)からなり、**直近の決算が改善基調で実現しているのか一時的な山なのか**を
  # 測っている。前者なら外挿の出発点は信頼でき、後者なら成長は早く消える。
  #
  # 実測(28.10):モデル確率の上位デシルに限ると Piotroski の順位ICは
  # **+0.138(9評価日中8日で正)** と、モデルが取りこぼしている情報として最大。
  # 生存確率(健全性 → ハザード率)だけでは拾いきれていない(同じ部分集合で
  # 生存確率のICは +0.035)。
  #
  # 減衰率に載せた効果:上位デシルの破綻率がユニバース比 1.21 → 1.13、
  # 最悪評価日のリフトが 0.79 → 0.94。リフト平均と単調性はほぼ不変。
  # **上振れを削らずに下振れを減らす**方向に働くため採用した。
  #
  # fade = 0.75 + 0.06 × 品質(−1〜+1)。F-score 満点で 0.81、0点で 0.69。
  # 7年後に残る初期超過成長は 0.81^7 = 21% と 0.69^7 = 7.4% の差になる。
  fade_quality_sensitivity: 0.06
  min_fade: 0.55
  max_fade: 0.92

# --- 粗利率の推移(27.2) ------------------------------------------------------
margin:
  # 直近2期の粗利率変化を将来へ引き伸ばすときの減衰(利益率改善は平均回帰する)
  trend_damping: 0.40
  # 7年間で許容する粗利率の変化幅(ポイント)
  max_total_change: 0.15
  # S-2(2026-08-26追加、model_audit_v4_2026-08-26.md):粗利率が薄い銘柄ほど
  # 絶対ポイントの上限(max_total_change)が過大な倍率になる問題への対処。
  # 終端粗利率は現在値の何倍までを許すか。「擬似バックテストで選んだ値」に
  # 分類される(独立な観測期間が実質3つしかなく、弱くしか特定されていない)。
  #
  # 実測(2026-08-26、run-backtest比較):1.3/1.5 は無効時よりデシル単調性・
  # リフト・rank_ICのいずれも悪化した(1.3で単調性 0.830→0.758)——薄利企業の
  # 改善シグナルを削りすぎていた。2.0 は無効時と比べリフト・rank_IC・
  # 上位デシル破綻率を悪化させずに、単調性 0.830→0.867、t値 3.30→3.45、
  # そして最悪評価日のリフトを 0.893→1.021(28.16の既知の弱点=最悪日リフトが
  # 1を割る、を解消)に改善したため 2.0 を採用した。1.5等の狭い値は
  # 「相対キャップとして機能する前に単調性を壊す」ため見送った。
  max_relative_change: 2.0
  floor: 0.05
  ceiling: 0.90

  # 30.1:粗利率トレンドの循環性割引(考え方は growth.cyclicality_damping と同一)。
  #
  #   effective_trend = (現在 − 前期) × trend_damping × (1 − damping × (1 − consistency))
  #
  # **なぜ必要か(実測、2026-08-28)**:ランキング上位50の期待倍率のうち、
  # 利益率因子だけで ln 寄与 0.287(全体 1.149 の 25%)を作っている。しかもその
  # 推定量は**観測2点の差分**である。上位50の66%が `margin_multiple > 1.2` を持ち、
  # セクター構成は Basic Materials が上位進出率 26.0%、Energy が 21.2%
  # (Technology 2.3%、Healthcare 5.0%)——母集団の 11.6% しかない素材・エネルギーが
  # 上位50の40%を占めていた。価格受容者であり再投資の複利が構造的に効かない
  # カテゴリが 10バガー探索の上位を占めるのは、推定量が循環を構造と読み違えて
  # いるためである。
  #
  # 実測(compare-configs、1年ホライズン・9評価日、damping = 1.0):
  #   lift 1.401 → 1.335(−0.066)、単調性 0.794 → 0.830(+0.036)、
  #   rank_IC 0.099 → 0.097(−0.002)。**3項目ともCI内。**
  # 出荷値は成長側と揃えて 0.5(半分だけ補正する)。
  #
  # **補正は対称である**——市況で一時的に落ち込んだ粗利率も同じだけ割り引く。
  # 片側だけに効かせると S-1 と同型の「無償の加点装置」になる。
  # 一致度が測れない銘柄(年次3期未満)は補正しない(27.1:欠損を減点に読み替えない)。
  cyclicality_damping: 0.5

# --- 終端マルチプル(28.2) ----------------------------------------------------
multiple:
  # **マルチプルの成長弾力性 κ。断面の値づけ構造から測った構造パラメータ。**
  #
  #     ln(EV/粗利) = 定数 + κ · g
  #
  # **実測(2026-08-26、価格ヒストリー全期間の20断面、各700〜800銘柄)**:
  #   範囲 +0.681 〜 +1.098、平均 **+0.863**、断面間の標準偏差 0.117
  #   t値はどの断面でも +3.5 〜 +6.3(符号は20断面すべてで正)
  #   決定係数は0.02〜0.06と低いが、これは想定どおり——EV/粗利のばらつきの
  #   大半は成長率以外(利益率構造・セクター・センチメント)で決まる。
  #   ここで必要なのは傾きの大きさであって説明力ではない。
  #
  # `uv run python -m autoscreener.cli estimate-elasticity` で再推定できる。
  # ユニバース(市場・時価総額レンジ・除外セクター)を変えたら必ず測り直すこと。
  #
  # **リターンには一切フィットさせていない。** これは較正ではなく測定である。
  # 用途は「成長が g0 から g_H へ減速したとき、整合的なマルチプル変化は
  # exp(κ·(g_H − g0)) である」という一点だけ。言い換えると、
  # **今の株価が既に払っている成長の対価を、二重に受け取らないための項**。
  #
  # 感度(28.2):κ=0 では上位デシルの破綻率がユニバース比1.43倍に悪化する
  # (成長の対価の二重取りを止められず、高成長銘柄に張り付く)。κ=1.5 では
  # リフトがやや上がるが、それはリターンへのフィットであり採らない。
  #
  # **注意:κ は時期によって動く。** 2024年前半は0.93前後、2026年前半は0.68前後と
  # 低下傾向にある(市場が成長に払う対価が縮んでいる)。ここでは全期間の平均を
  # 固定値として使う——7年先を外挿するモデルに直近の断面値を入れると、
  # 相場つきの短期変動がそのまま7年の見通しに乗ってしまうため。
  #
  # **E-4(2026-08-27、defect_audit_2026-08-27.md):説明変数のクランプ問題。**
  # `estimate_elasticity_over_history` の説明変数 `base_initial_growth` は
  # `max_initial_rate`(0.60)/ `max_initial_rate_single_observation`(0.45)で
  # 丸め済みであり、高成長企業が上限の一点に潰れて回帰へ入る(打ち切り回帰 →
  # κ が減衰方向へバイアスしうる)。`estimate-elasticity` は「クランプ銘柄を
  # 含む κ」と「除いた κ」を並べて出力するようにした。2値の乖離が断面間の
  # 標準偏差(0.117)の範囲内であれば、現状のクランプ済み成長率を使う測定方法は
  # 妥当と判断してよい。乖離が大きい場合のみ `raw_initial_growth`(クランプ前)を
  # 説明変数に切り替える(ランキング計算側の `base_initial_growth` は変えない。
  # クランプは外挿の暴走防止という別目的で必要)。
  # 判定結果(2026-08-27 実測、interval_days=60、価格ヒストリー全期間16断面):
  #   クランプ銘柄を含む κ = +0.8318(断面間SD 0.1252)
  #   クランプ銘柄を除く κ = +0.8132(断面間SD 0.2040)
  #   乖離 0.0186 ≪ 断面間SD 0.1252 → **クランプ済み成長率を説明変数に使う
  #   現状の測定方法は妥当**。`raw_initial_growth` への切り替えは不要。E-4 完了。
  #
  # **29章:ユニバースを広げたときの κ(2026-08-27、17断面)。**
  # 本ファイル冒頭の指示(「ユニバースを変えたら必ず測り直すこと」)に従って再測定した。
  #   上限 3.5B(既定の目標の母集団) κ = +0.832(断面間SD 0.125)
  #   上限 11.7B(materialize範囲)  κ = +1.001(断面間SD 0.101)
  #   上限 24B                      κ = +1.014(断面間SD 0.101)
  # 乖離(0.169)は断面間のばらつきを超えており、**κ は母集団のレンジに依存する**。
  # ただし κ=1.00 を採ると擬似バックテストのKPIは改善しなかった:
  #   3年3倍・上限11.7B:単調性 0.867→0.806、リフト 1.56→1.54(最悪日 1.39→1.32)、
  #                      順位IC +0.137→+0.140
  #   7年10倍・上限3.5B:単調性 0.806→0.770、リフト 1.50→1.50、順位IC +0.152→+0.168
  # 単調性と最悪日リフトが揃って悪化し、改善するのは順位ICだけ。**値は変更しない。**
  # 断面回帰の傾きが母集団の合成で動くこと自体は珍しくない(大型株が低成長・低倍率の
  # 一点に集まると傾きが立つ)ので、構造パラメータが変わった証拠とまでは言えない。
  growth_elasticity: 0.86

  # 7年間で許容するマルチプル変化の倍率レンジ。外挿の暴走を防ぐ。
  # v4 の圧縮は κ·(g_H − g0) なので、g0 の上下限(−0.30〜0.60)から
  # 変化率は自然に 0.55〜1.40 の範囲に収まり、この丸めは実質的に効かない。
  # 保険として残している。
  max_change: 3.0
  min_change: 0.30

  # 30.3:**終端 EV/粗利の絶対上限。**(investment_theory_review_2026-08-30.md)
  #
  #   cap = percentile(当日断面の EV/粗利, terminal_cap_percentile) × terminal_cap_slack
  #
  # v4 は終端倍率を `M_0 × exp(κ(g_H − g_0))` としか動かさない。28.2 の
  # 「適正倍率について市場に対する優位を主張しない」という立場は**今日の倍率**に
  # ついては正しいが、その帰結として、EV/粗利 99倍で入った銘柄は7年後(成長が
  # 終端成長率 3% まで減速した後)も 65倍のまま評価され、その水準を前提に
  # 終端株主価値が積み上がる。**3%成長の事業が断面の最上位帯の倍率を維持する**
  # という前提は、どの投資理論からも支持されない。
  #
  # 実データ(2026-08-28、716銘柄)の EV/粗利:中央値 5.8 / p90 15.6 / p95 22.1 /
  # p99 53.6 / 最大 869.3。p95 × 1.5 ≒ 41倍 は**意図的に緩い**上限で、
  # 断面の上位2〜3%(AEHR 129倍・KOS 206倍・ALM 3138倍のような帯)にしか効かない。
  # 上限に当たった銘柄は `terminal_multiple_capped` フラグとUIの警告バッジで見える。
  #
  # 実測(compare-configs、1年ホライズン・9評価日):
  #   lift 1.401 → 1.408(+0.006)、単調性 0.794 → 0.721(−0.073)、
  #   rank_IC 0.099 → 0.103(+0.004)。**3項目ともCI内。**
  # 単調性の低下は該当が数銘柄しかないことによるノイズと読む。lift と rank_IC は
  # わずかに改善しており、順位への実害は測れていない。
  terminal_cap_percentile: 0.95
  terminal_cap_slack: 1.5

  # 30.5:**成長調整後の割高・割安(断面回帰の残差)を終端倍率へどれだけ戻すか。**
  # **測定したうえで採用しなかった。既定 0.0 のままにすること。**
  #
  #   ln M_0 = c + κ·g_0 + ε        (c は当日の断面から中央値で測る)
  #   ln M_H = c + κ·g_H + (1 − w)·ε
  #
  # **問題意識**:現行モデルのランキングは入口のバリュエーションと **正の** 相関を
  # 持つ。`corr(P, ln(EV/粗利)) = +0.118`(716銘柄)/ `+0.176`(既定ユニバース
  # 401銘柄)、上位50の EV/粗利 中央値は 7.0倍(ユニバース 4.4倍)。同じ事業を
  # 5倍で買うのと 50倍で買うのとで期待倍率が変わらない——どころか後者が高い。
  # `E[M_H] = M_0` は「割高さは7年後も同じだけ残る」という、それ自体強い主張である。
  #
  # **v3 の平均回帰とは別物**:v3 はセクター中央値(成長率を見ない)へ寄せていた
  # ため「成長しないから安い」銘柄を買い上げていた(順位IC −0.023)。ここで寄せる
  # 先は**その銘柄自身の成長率で説明される水準** `c + κ·g` であり、動くのは
  # 同じ成長率の銘柄と比べた割高/割安分だけである。
  #
  # 断面への効果(2026-08-28、401銘柄):
  #   w      ρ(P, ln EV/粗利)   上位50の ln(EV/粗利) 中央値
  #   0.00        +0.176            +1.94  (ユニバース +1.49)
  #   0.15        −0.077            +1.35
  #   0.30        −0.212            +0.96
  #   0.50        −0.408            +0.57   ← ディープバリュー選好へ反転。v3 の罠
  #
  # 実測(compare-configs、1年ホライズン・9評価日):
  #   w=0.15: lift 1.401 → 1.266(−0.135)、単調性 0.794 → 0.685(−0.109)、
  #           rank_IC 0.099 → 0.080(−0.019)
  #   w=0.30: lift 1.401 → 1.271(−0.130)、単調性 0.794 → 0.782(−0.012)、
  #           rank_IC 0.099 → 0.073(−0.027)
  # いずれもCI内で「悪化した」とは断定できないが、**3KPIとも一貫して負**であり、
  # 28.1 が v3 の平均回帰項について測った符号と同じ向きである。理論的な問題意識
  # (入口価格がリターンから切り離されている)は本物だが、**現在のデータはこの
  # 実装での是正を支持していない。** 生存バイアス(D-1)が解けて評価日が増えたら
  # 再測定すること。それまでは 0.0。
  residual_reversion_weight: 0.0

# --- 希薄化(15.1④) ----------------------------------------------------------
dilution:
  min_annual_rate: -0.05   # 自社株買いによる増価は年5%までしか織り込まない
  max_annual_rate: 0.50

  # 30.4:**自社株買いだけを減衰させる。**(investment_theory_review_2026-08-30.md)
  #
  #   drag = Π_t (1 + r_t),  r_t = r                      (r ≥ 0:増資)
  #                          r_t = r × persistence^(t−1)  (r < 0:自社株買い)
  #
  # **増資と自社株買いは対称ではない。** 増資は資金需要という構造から生じる
  # ——赤字で成長する企業は資金が要るから発行するのであり、その必要は翌年も残る。
  # 一方、自社株買いは経営の裁量的な資本配分であり、しかも景気循環に対して
  # 順張りである(利益とキャッシュフローがピークにある年に増え、不況期に真っ先に
  # 止まる)。過去の買い戻しペースを7年複利で効かせると、下限(−5%/年)に
  # 張り付いた銘柄へ無償で 1/0.95⁷ = **1.43倍**を配ることになる。
  # A-1(希薄化の欠損を「希薄化ゼロ」に読み替えていた欠陥)と同型の、
  # 「都合のよい仮定を無償の加点に変える」経路である。
  #
  # 実データ(2026-08-28)では、ランキング上位50の **14%**・51〜200位の **20%** が
  # この下限に張り付いていた。
  #
  # 実測(compare-configs、1年ホライズン・9評価日、persistence = 0.7):
  #   lift 1.401 → 1.380(−0.021)、単調性 0.794 → **0.879(+0.085)**、
  #   rank_IC 0.099 → 0.100(+0.000)。**3項目ともCI内**だが、本監査で試した
  #   全変更のなかで最も素直な形(lift・IC は不変、単調性だけ改善)である。
  #
  # 0.7 なら7年間の累積の買い戻しは満額の約 3.2 年分に相当する。
  buyback_persistence: 0.7

# --- 生存確率(27.4) ----------------------------------------------------------
survival:
  # 健全性指標が中立(0)のときの年間ハザード率。小型株の上場廃止率の実勢に合わせる
  base_annual_hazard: 0.06
  # 健全性指標(-1〜+1)がハザードを動かす強さ。+1で 0.06*e^-1.2 = 1.8%/年
  health_sensitivity: 1.2

# --- 不確実性(27.5・28.4・28.6) ----------------------------------------------
# log-MOIC を正規分布と仮定したときの標準偏差の構成要素
uncertainty:
  # 過去の年次成長率のばらつきが取れないときに使う既定値
  default_growth_volatility: 0.30
  min_growth_volatility: 0.10
  max_growth_volatility: 0.60
  # 終端マルチプルの対数空間でのばらつき(EV/GPのクロスセクション分散に対応)
  multiple_sigma: 0.55
  margin_sigma: 0.20
  dilution_sigma: 0.15
  min_total_sigma: 0.50
  max_total_sigma: 2.50

  # 28.6:財務健全性を σ へ伝播させる強さ。σ に exp(−sensitivity × health) が掛かる。
  # 実測では健全性が最も低いデシルほど「1年で2倍」の達成率も「−50%以下」の
  # 割合も同時に高い(2倍 15.1% / 破綻 15.9%、最上位デシルは 5.8% / 4.2%)。
  # 脆弱な企業は**上下どちらの裾も厚い**。生存確率(下向き)だけを掛けて σ(両側)を
  # 据え置くと、上向きの裾を系統的に過小評価することになる。
  # 0.15 なら health=−1 で σ が16%広がり、health=+1 で14%縮む。
  health_sigma_sensitivity: 0.15

  # 28.4:**σ を断面中心へ縮小する重み(対数空間)。**
  #
  # σ の4項のうち銘柄ごとに実際に変わるのは(a)過去の年次成長率のばらつきと
  # (b)レバレッジ倍率だけで、残りは全銘柄共通の定数である。しかも(a)は年次が
  # 4期以上ある銘柄でしか算出できず、**実データでの充足率は33%**——残り3分の2は
  # 既定値0.30が入る。つまり σ の断面のばらつきは、大半が「測れたか測れなかった
  # か」というデータ充足の差でしかない。
  #
  # 対数正規の閾値超過確率は σ に極めて敏感なので、この誤差をそのまま確率に
  # 通すと順位が σ の推定ノイズに支配される。誤差の大きい推定量を母集団の
  # 中心へ寄せるのは縮小推定(James–Stein)の標準的な扱い。
  #
  # 実測(28.4、縮小を 0.0 → 1.0 に動かしたときの変化):
  #   1年: IC +0.063→+0.066、上位デシル破綻率 1.556→1.196(ユニバース比)
  #   2年: IC +0.078→+0.082、上位デシル破綻率 1.320→0.926、単調性 +0.64→+0.61
  # 縮小を強めるほど破綻率と IC が改善する。
  #
  # **帰結:v4の順位は実質的に「生存確率で調整した期待倍率」の順序に近い。**
  # 0.85 では σ の断面差が15%しか残らない。これは隠すべき事実ではなく、
  # 現在のデータで σ の銘柄差を主張できるだけの根拠が無いという状態表明である。
  # 年次期数が伸びて(a)の充足率が上がれば、この値を下げて銘柄差を復活させる。
  sigma_shrinkage: 0.85

  # D-7(defect_and_edge_audit_2026-08-28.md):点推定(expected_moic)を対数正規の
  # 「平均」とみなすか「中央値」とみなすか。"median" なら mu = ln(expected_moic)
  # (−σ²/2 の恒久的減額をしない)。expected_moic は5因子の中心的見通しの積で
  # あって平均ではない(平均には各因子に exp(σ_i²/2) が要るが掛けていない)ため、
  # 構造的には中央値側の量。**既定は現状維持("mean")。** D-1/D-2 修正後に
  # compare-configs で calibration_error と rank_ic の変化を測って決める。
  point_estimate_interpretation: "mean"

# --- 貸借対照表の射影(D-6 / defect_and_edge_audit_2026-08-28.md) ---------------
# terminal_equity = terminal_ev - net_debt で net_debt を7年間名目一定と仮定して
# いる。ネットキャッシュを持つ赤字マイクロキャップ(このアプリの中心プロファイル)
# を systematically 過大評価する向きに効く。**既定は無効。** フラグだけ先に入れ、
# D-1/D-2 が直ってから compare-configs で採否を判定する。診断値
# (projected_net_debt / net_debt_change)は無効時でも計算して factors に出す。
balance_sheet:
  project_net_debt: false
  fcf_margin_fade: 0.75
  max_net_cash_credit_years: 7

# --- 規模の事前分布(28.7) ----------------------------------------------------
# **既定で無効(exponent: 0.0)。**
# v3は「MOICの算術は規模に対して中立だが、現実の10倍達成率は規模とともに
# 低下する」という仮説でこの項を置いていたが、実データは支持しなかった。
#   1年: この項を入れると lift 1.245→1.208、IC +0.082→+0.078
#   2年: lift 1.141→1.076
# 時価総額デシル別のオンペース率もほぼ平坦(0.22〜0.29)で、最小デシルはむしろ
# 破綻率が最悪(25.4% vs 全体10%)だった。
# v4ではこの項が担おうとしていた機構を、成長フェードのマルチプル圧縮(28.2)が
# 構造的に引き受けている。設定は残してあるので、母集団や期間が変われば
# `exponent` を上げて復活させられる。
size_prior:
  exponent: 0.0
  reference_market_cap_usd: 300_000_000

# --- ランキング対象の最低要件(27.7) ------------------------------------------
requirements:
  # モデルの必須入力(売上・粗利・株式数・EV)がすべて揃っていること。
  # 欠損は「スコアが低い」ではなく「測れない」として Tier 2 の監視対象に回す。
  min_annual_revenue_periods: 2
  min_gross_profit_usd: 1_000_000
  # 27.13:時価総額がEVに占める割合の下限。これを下回る超高レバレッジ銘柄
  # (CRMT:時価総額$21M・ネットデット$725M = EVの2.8%)の株式は実質的に
  # 債務に対するコールオプションであり、対数正規のMOICモデルは成立しない。
  min_equity_share_of_ev: 0.15
  # 27.17:各因子の中心的見通しを掛け合わせた期待倍率がこれを下回る銘柄は
  # ランキングしない。1.0 = 株主価値を毀損する見通し。
  #
  # 対数正規モデルは、期待値を固定したまま分散を広げると閾値超過確率を
  # (ある点まで)**上げる**——これは数学的に正しいが、事業が縮小していく
  # 見通しの銘柄に当てはめると「モデルが外れることに賭ける」ことになる。
  min_expected_moic: 1.0

# --- 確率の較正(28.8) --------------------------------------------------------
# モデルが出す生の確率は、対数正規という**仮定**の下での閾値超過確率であって、
# 実測された頻度ではない。v3ではこの2つが 4.8pt ずれていた(較正誤差)。
# 較正層は擬似バックテストの観測から「生の確率 → 実測オンペース率」の単調な
# 写像を学習し、表示する確率をその写像に通す。
#
# **これは順位を変えない**(単調写像なので)。変わるのは確率の**水準**だけで、
# 「上位銘柄の P(10倍) が 3% と表示される」という数字が、実測に裏打ちされた
# ものになるか、モデルの仮定だけに依存したものになるかの違いである。
#
# 学習には `run-backtest` の観測を使う。バックテストを一度も実行していない、
# または観測が min_observations に満たない場合は較正されず、生の確率がそのまま
# 表示される(UIにはどちらの状態かが出る)。
calibration:
  enabled: true
  min_observations: 1000
  bins: 10

# --- データ鮮度の前提条件(A-1 / defect_and_edge_audit_2026-08-28.md D-12) -------
# 日次収集が一斉隔離・レート制限・ネットワーク断で途中停止すると、run_scoring は
# 前日以前の価格・財務で当日付の scores を書き続けてしまう(2026-08-28 のランキングは
# 08-24 の株価で作られていた)。古いランキングを新しい日付で出すより中止するほうが安全。
#   max_price_staleness_days     : 最新 price_snapshots がこの営業日数より古ければ中止
#   min_same_day_price_coverage  : ゲート通過銘柄のうち最新取引日の価格行を持つ割合の下限
freshness:
  max_price_staleness_days: 2
  min_same_day_price_coverage: 0.9

# --- KPIの受け入れ基準(A-5 / defect_and_edge_audit_2026-08-28.md D-3) ----------
# 14.2 の成功指標を機械可読にしたもの。run-backtest が各KPIを
# PASS / FAIL / INSUFFICIENT_DATA で判定し、FAIL があれば非ゼロ終了する。
# **D-1(生存者バイアス)/ D-2(有効標本不足)が直るまで、多くのKPIは
# INSUFFICIENT_DATA になる想定であり、それが正しい状態表明である。**
kpi_acceptance:
  min_lift_ratio: 1.5
  max_top_decile_loss_ratio: 0.8
  min_decile_monotonicity: 0.7
  max_abs_calibration_error: 0.03
  min_rank_ic: 0.03
  min_effective_dates: 6
