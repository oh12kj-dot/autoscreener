[project]
name = "autoscreener"
version = "0.1.0"
description = "10-bagger candidate screening app — data collection foundation (Phase 1)"
requires-python = ">=3.12"
dependencies = [
    "yfinance==1.4.1",
    "exchange-calendars>=4.11,<5.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "tenacity>=8.2,<9.0",
    "typer>=0.12,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "lxml>=5.0,<6.0",
    # K-9:Claude API(定性分析)。未設定のAPIキーで無効化できるため、
    # LLMを使わない運用でもこの依存は害にならない。
    "anthropic>=1.0,<2.0",
    # K-9(UIプロバイダ選択、docs/ui_llm_provider_selection_2026-08-30.md):
    # `llm.provider = openai_compat` のときだけ使う。NVIDIA NIM / ChatGPT /
    # Ollama / vLLM / LiteLLM はいずれも OpenAI 互換 API を持つので、SDKは1つで足りる。
    "openai>=1.40,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.12,<4.0",
    "responses>=0.25,<1.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
